
services:
  postgres:
    image: postgres:16-alpine
    container_name: hjs-partstruck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hjspartstruck
      POSTGRES_USER: hjspartstruck_user
      POSTGRES_PASSWORD: hjspartstruck_pass
    ports:
      - "5433:5432"
    volumes:
      - hjspartstruck_pgdata:/var/lib/postgresql/data

volumes:
  hjspartstruck_pgdata:

